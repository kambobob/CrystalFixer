name: CrystalPvP
version: 1.1.0
main: com.example.crystalpvp.CrystalPvPPlugin
api-version: '26.2'
folia-supported: true
softdepend: [packetevents]
description: No crystal/anchor fire, damage buffs and a crystal optimizer.
author: YourName

commands:
  crystalpvp:
    description: CrystalPvP admin command
    usage: /crystalpvp <reload|status>

permissions:
  crystalpvp.reload:
    description: Reload config and view status
    default: op
